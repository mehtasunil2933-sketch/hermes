zerops:
  - setup: hermes

    build:
      base: python@3.11
      os: ubuntu
      buildCommands:
        - echo "hermes is installed on the volume in run.initCommands"
      deployFiles: ./

    run:
      base: python@3.11
      os: ubuntu

      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y curl git xz-utils libatomic1 sqlite3 ripgrep ffmpeg rclone

      volume:
        hostname: vol
        mountPath: /mnt/vol

      envVariables:
        HERMES_HOME: /mnt/vol/hermes
        HERMES_WRITE_SAFE_ROOT: /mnt/vol/hermes
        UV_PYTHON_INSTALL_DIR: /mnt/vol/uv-python
        API_SERVER_HOST: 0.0.0.0
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: sunil
        MALLOC_ARENA_MAX: "2"
        PYTHONUNBUFFERED: "1"
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_REGION: auto
        RCLONE_CONFIG_R2_ACL: private
        R2_BUCKET: hermes-backup

      initCommands:
        - mkdir -p /mnt/vol/hermes /mnt/vol/backup /mnt/vol/uv-python
        - touch /mnt/vol/hermes/.env && chmod 600 /mnt/vol/hermes/.env
        # install only if missing or broken; fresh installs also get messaging + daytona extras
        # Zerops runs initCommands without $HOME set; the installer needs it (set -u)
        - >
          export HOME=/home/zerops;
          if [ -f /mnt/vol/hermes/hermes-agent/.hermes-bootstrap-complete ] &&
          /mnt/vol/hermes/hermes-agent/.hermes/bin/hermes --version >/dev/null 2>&1;
          then echo "hermes already installed";
          else curl -fsSL https://hermes-agent.nousresearch.com/install.sh |
          bash -s -- --skip-browser --skip-computer-use --non-interactive --verbose &&
          /mnt/vol/hermes/hermes-agent/.hermes/bin/hermes pm install
          --extra messaging --extra daytona --without cua-driver --without agent-browser;
          fi
        - sudo ln -sf /mnt/vol/hermes/hermes-agent/.hermes/bin/hermes /usr/local/bin/hermes

      start: bash -c "hermes dashboard --host 0.0.0.0 --port 9119 & exec hermes gateway run"

      ports:
        - port: 8642
          httpSupport: true
        - port: 9119
          httpSupport: true

      crontab:
        - command: sqlite3 /mnt/vol/hermes/state.db ".backup /mnt/vol/backup/state.db"
          timing: "30 * * * *"
          allContainers: false

        - command: >
            set -e;
            STAMP=$(date -u -I);
            hermes backup -o /mnt/vol/backup/hermes-$STAMP.zip;
            rclone copyto /mnt/vol/backup/hermes-$STAMP.zip
            r2:$R2_BUCKET/hermes/hermes-$STAMP.zip;
            rclone copyto /mnt/vol/backup/hermes-$STAMP.zip
            r2:$R2_BUCKET/hermes/latest.zip;
            find /mnt/vol/backup -name 'hermes-*.zip' -mtime +3 -delete;
            rclone delete r2:$R2_BUCKET/hermes/ --min-age 30d --include 'hermes-*.zip'
          timing: "45 3 * * *"
          allContainers: false
